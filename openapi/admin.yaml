package: admin
output: admin/client.gen.go
generate:
  models: true
  client: true
output-options:
  nullable-type: true
  name-normalizer: ToCamelCaseWithInitialisms
  user-templates:
    client.tmpl: ./openapi/templates/client.tmpl
    client-with-responses.tmpl: ./openapi/templates/client-with-responses.tmpl
additional-imports:
  - package: github.com/use-lock/client-go
    alias: lock
  - package: github.com/use-lock/client-go/internal/transport
    alias: transport
