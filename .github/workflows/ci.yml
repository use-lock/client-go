name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: make check
      - run: go generate ./...
      - run: git diff --exit-code
      - name: Check release configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.1
          args: check
